sonar.organization=ricardordev
sonar.projectKey=express-transactions

sonar.sources=src/
sonar.tests=test/
sonar.test.inclusions=src/**/__tests__/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude non-testable infrastructure/config files from coverage (matching vitest.config.cov.ts)
sonar.coverage.exclusions=src/generated/**,\
  src/types/**,\
  src/**/*.routes.ts,\
  src/infrastructure/prisma.ts,\
  src/infrastructure/swagger.ts,\
  src/server.ts,\
  test/**